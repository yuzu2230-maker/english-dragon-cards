<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>apple</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    margin-top:50px;
}

h1{
    font-size:48px;
}

h2{
    color:#666;
}

button{
    font-size:32px;
    padding:20px 40px;
    margin-top:20px;
}

</style>
</head>

<body>

<h1>apple</h1>

<h2>りんご</h2>

<button onclick="playAudio()">
🔊 発音する
</button>

<br><br>

I eat an apple every day.

<br><br>

私は毎日りんごを食べます。

<audio id="audio">
    audio/apple.mp3
</audio>

<script>

function playAudio(){

    document
        .getElementById("audio")
        .play();

}

</script>

</body>
</html>
